<style>
:root{--bg:#eef6fb;--ink:#22344d;--card:#fff;--accent:#4f86c6;--muted:#5d7088}
@media (prefers-color-scheme:dark){:root{--bg:#141d29;--ink:#e6eef6;--card:#1e2a3a;--accent:#8fb8e8;--muted:#9fb0c4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 48px}
nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}nav a{color:var(--accent);font-weight:700;text-decoration:none}
h1{font-size:2rem;margin:0 0 4px}p.lead{margin:0 0 28px;color:var(--muted)}
article,.grid figure{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
article{margin-bottom:18px}article h2{margin:2px 0 8px;font-size:1.3rem}article p{margin:0 0 10px}
time{font-size:.85rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.art{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:12px;margin-top:12px}
figure{margin:0}figcaption{font-size:.9rem;color:var(--muted);margin-top:6px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:16px}
.grid figure{padding:12px}.grid figcaption{text-align:left}.grid b{display:block;color:var(--ink)}.grid span,.grid small{display:block}
footer{text-align:center;font-size:.85rem;color:var(--muted);margin-top:32px}footer a{color:var(--accent)}
